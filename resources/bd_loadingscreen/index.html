<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        /* CSS to center the Logo */
        .img-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10; /* Ensures logo sits on top of video */
        }
        
        .server-logo {
            width: 25%;
            max-width: 500px;
            height: auto;
            animation: pulse 3s infinite;
        }

        /* CSS for the MP4 Video Background */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1; /* Puts video behind everything */
        }

        .video-container video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover; /* Key property: This makes the video cover the whole screen */
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body class="sky noselect">

    <div id="circleG">
        <div class="shaded-text">JOINING SERVER</div>
        <div id="circleG_1" class="circleG"></div>
        <div id="circleG_2" class="circleG"></div>
        <div id="circleG_3" class="circleG"></div>
    </div>

    <div class="video-container noselect">
        <video autoplay muted loop id="myVideo">
            <source src="video/video1.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>
        
    <audio id="loading" src="song/song1.mp3" autoplay="true" hidden="true" loop="true"></audio>
    
    <div class="background">
        <div class="img-center">
            <img src="song/logo.png" class="server-logo" alt="Last Border Logo">
        </div>
    </div>

    <script src="script/main.js"></script>
    
    <script>
        var vid = document.getElementById("myVideo");
        vid.volume = 0.0; // 0.0 is mute, 1.0 is full volume

        const audio = document.getElementById("loading");

  // Wait for the audio metadata (length, etc.) to load
  audio.addEventListener('loadedmetadata', function() {
    this.currentTime = 10; // Jump to 10 seconds
    this.play();           // Then start playing
  });
    </script>
</body>
</html>
